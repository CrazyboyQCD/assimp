
[workspace]
resolver = "2"
members = ["rassimp", "cli", "viewer"]

[workspace.dependencies]
rassimp = { path = "rassimp" }
bitflags = { version = "2.9.1", default-features = false }
byteorder = { version = "1.5.0", default-features = false }
clap = { version = "4.0", default-features = false }
encoding_rs = { version = "0.8.35", default-features = false }
glam = { version = "0.30", default-features = false }
indexmap = { version = "2.10.0", default-features = false }
lexical-parse-float = { version = "1.0.5", default-features = false }
thiserror = { version = "2.0.12", default-features = false }

[profile.release]
debug = true
